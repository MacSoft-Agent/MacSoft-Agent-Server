model:
  provider: openai-codex
  default: gpt-5.4

stt:
  enabled: true
  provider: auto
  routing:
    prefer_current_provider: true
    cloud_first: true
    local_fallback: true
  local:
    model: large-v3-turbo

platforms:
  api_server:
    enabled: true
    extra:
      host: 127.0.0.1
      port: 8642
      key: "${MACSOFT_LOCAL_API_KEY}"

platform_toolsets:
  api_server:
    - macsoft_autocount
    - skills_readonly

plugins:
  enabled:
    - macsoft-autocount
  disabled: []
  entries:
    macsoft-autocount:
      allow_tool_override: false

security:
  redact_secrets: true
