server:
  host: "0.0.0.0"
  port: 8787

database:
  path: "./data/macsoft-server.db"

hermes:
  home: "../runtime"
  profile_root: "../runtime/profiles"
  api_base_url: "http://127.0.0.1:8642"
  api_key: "${MACSOFT_LOCAL_API_KEY}"
  request_timeout_seconds: 7200

models:
  default_model: "server-default"
  fallback_model: "server-fallback"

runtime:
  mode: "minimal"

autocount:
  enabled: false
  catalog_path: "../runtime/plugins/macsoft-autocount/catalog.json"
