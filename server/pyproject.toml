[project]
name = "macsoft-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp==3.14.1",
    "fastapi==0.133.1",
    "uvicorn[standard]==0.41.0",
    "pyyaml==6.0.3",
    "python-multipart==0.0.27",
    "openpyxl==3.1.5",
    "pypdf==6.14.2",
    "pymupdf==1.26.3",
    "pillow==12.2.0",
    "httpx==0.28.1",
    "httpx2==2.7.0",
    "psutil==7.2.2",
    "pywin32==311; sys_platform == 'win32'",
    "psycopg[binary]==3.3.4",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.uv]
package = false
# These packages overlap Hermes transitively. Constrain the isolated Server
# test environment to the versions selected by the unified product lock.
constraint-dependencies = [
    "aiohappyeyeballs==2.6.1",
    "anyio==4.12.1",
    "attrs==25.4.0",
    "certifi==2026.5.20",
    "click==8.3.1",
    "httptools==0.7.1",
    "idna==3.18",
    "packaging==26.0",
    "pygments==2.19.2",
    "propcache==0.4.1",
    "starlette==1.0.1",
    "tzdata==2025.3; sys_platform == 'win32'",
    "typing-extensions==4.15.0",
    "watchfiles==1.1.1",
    "websockets==15.0.1",
    "yarl==1.22.0",
]
